<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TradeGuru —- Receipt Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #04080f;
            --bg2: #070d17;
            --surface: #0c1624;
            --surface2: #111d2e;
            --border: rgba(255,255,255,0.08);
            --gold: #f0b429;
            --green: #00c896;
            --blue: #38bdf8;
            --text: #e8edf5;
            --muted: #7a8fa8;
            --font-head: 'Poppins', sans-serif;
            --font-body: 'Nunito Sans', sans-serif;
        }
        body {background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
        
        /* ── TOP BAR ── */
        .topbar {background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
        .logo {font-family: var(--font-head); font-size: 1.3rem; font-weight: 700; color: var(--text); }
        .logo span { color: var(--gold); }
        .topbar-label {font-size: 0.78rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
        
        /* ── LAYOUT ── */
        .app {display: grid; grid-template-columns: 400px 1fr; min-height: calc(100vh - 61px); }
        
        /* ── FORM PANEL ── */
        .form-panel {background: var(--bg2); border-right: 1px solid var(--border); padding: 28px 24px; overflow-y: auto; height: calc(100vh - 61px); position: sticky; top: 0; }
        .form-section-title {font-family: var(--font-head); font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .form-section-title:first-of-type { margin-top: 0; }
        .form-group { margin-bottom: 14px; }
        label {display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.3px; }
        input, select, textarea {width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font-body); font-size: 0.88rem; padding: 10px 12px; outline: none; transition: border-color 0.2s; appearance: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--gold); }
        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }
        textarea { resize: vertical; min-height: 60px; }
        select option { background: #0c1624; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
        .btn-download {flex: 1; min-width: 140px; padding: 13px; background: var(--green); color: #000; font-family: var(--font-head); font-size: 0.88rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-download:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,200,150,0.3); }
        .btn-share {flex: 1; min-width: 110px; padding: 13px; background: var(--blue); color: #000; font-family: var(--font-head); font-size: 0.88rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-share:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(56,189,248,0.3); }
        .btn-reset {padding: 13px 16px; background: transparent; color: var(--muted); font-family: var(--font-head); font-size: 0.88rem; font-weight: 600; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
        .btn-reset:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }
        .auto-btn {background: none; border: 1px solid var(--border); color: var(--gold); font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 4px; cursor: pointer; float: right; margin-top: -2px; transition: background 0.2s; }
        .auto-btn:hover { background: rgba(240,180,41,0.1); }
        
        /* ── PREVIEW PANEL ── */
        .preview-panel {background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px 24px; overflow-y: auto; }
        .preview-label {font-size: 0.72rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 28px; align-self: flex-start; }
        
        /* ── RECEIPT ── */
        #receipt {background: #ffffff; width: 420px; border-radius: 20px; overflow: hidden; box-shadow: 0 32px 80px rgba(0,0,0,0.5); font-family: 'Poppins', sans-serif; padding-bottom: 24px; }
        .receipt-header {background: linear-gradient(135deg, #0a1628, #1a3a5c); padding: 32px 28px 28px; text-align: center; position: relative; transition: background 0.3s ease; }
        .receipt-header::after {content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 20px; background: #ffffff; border-radius: 20px 20px 0 0; }
        .receipt-tick {width: 64px; height: 64px; background: linear-gradient(135deg, #00c896, #00a87a); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(0,200,150,0.4); transition: background 0.3s ease, box-shadow 0.3s ease; }
        .receipt-tick svg { width: 32px; height: 32px; }
        .receipt-status {color: #ffffff; font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        
        .receipt-note { font-size: 0.78rem; color: #64748b; font-weight: 500; max-width: 280px; margin: 0 auto 12px; line-height: 1.4; font-style: italic; display: none; }
        .receipt-amount-label {color: #8fa0b8; font-size: 0.72rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
        .receipt-amount {color: #1a2a3a; font-size: 2.4rem; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
        
        /* Dynamic Inline Status Badge styling */
        .receipt-badge-container { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; border-radius: 8px; padding: 6px 14px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.3s ease; }
        .badge-success { background: #e6fcf5; border: 1px solid #c3fae8; color: #0ca678; }
        .badge-failed { background: #fff5f5; border: 1px solid #ffe3e3; color: #e03131; }

        .receipt-body {background: #ffffff; padding: 0 28px 12px; }
        .receipt-divider {height: 1px; background: #f0f4f8; margin: 16px 0; }
        .receipt-row {display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; gap: 16px; }
        .receipt-row-label {font-size: 0.78rem; color: #8fa0b8; font-weight: 500; flex-shrink: 0; min-width: 120px; }
        .receipt-row-value {font-size: 0.82rem; color: #1a2a3a; font-weight: 600; text-align: right; word-break: break-all; }
        .receipt-ref {background: #f8fafc; border: 1px dashed #d0dae8; border-radius: 8px; padding: 12px 16px; margin: 16px 0; text-align: center; }
        .receipt-ref-label {font-size: 0.68rem; color: #8fa0b8; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
        .receipt-ref-value {font-size: 0.85rem; color: #1a2a3a; font-weight: 700; letter-spacing: 0.5px; font-family: 'Courier New', monospace; }
        
        /* ── STATUS MESSAGES ── */
        .status-msg {margin-top: 20px; padding: 12px 18px; border-radius: 8px; font-size: 0.82rem; font-weight: 500; display: none; }
        .status-msg.success {background: rgba(0,200,150,0.1); border: 1px solid rgba(0,200,150,0.3); color: var(--green); display: block; }
        .status-msg.error {background: rgba(255,82,82,0.1); border: 1px solid rgba(255,82,82,0.3); color: #ff5252; display: block; }
        
        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; }
            .form-panel { height: auto; position: static; }
            .preview-panel { padding: 24px 16px; }
            #receipt { width: 100%; max-width: 420px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">Trade<span>Guru</span></div>
        <div class="topbar-label">Receipt Generator</div>
    </div>
    <div class="app">
        <div class="form-panel">
            <div class="form-section-title">Customer Details</div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="f-name" placeholder="Rahul Kapoor" oninput="liveUpdate()"/>
            </div>
            <div class="form-group">
                <label>Account</label>
                <input type="text" id="f-account" placeholder="1234567890" maxlength="12" oninput="liveUpdate()"/>
            </div>
            <div class="form-group">
                <label>IFSC</label>
                <input type="text" id="f-ifsc" placeholder="SBIN0001234" oninput="liveUpdate()"/>
            </div>
            
            <div class="form-section-title">Plan & Payment</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Plan</label>
                    <select id="f-plan" onchange="liveUpdate()">
                        <option value="Basic Plan">Basic</option>
                        <option value="Pro Plan" selected>Pro</option>
                        <option value="Elite Plan">Elite</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Billing</label>
                    <select id="f-billing" onchange="liveUpdate()">
                        <option value="Monthly">Monthly</option>
                        <option value="Yearly">Yearly</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" id="f-amount" placeholder="299" oninput="liveUpdate()"/>
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select id="f-method" onchange="liveUpdate()">
                    <option value="IMPS">IMPS</option>
                    <option value="NEFT">NEFT</option>
                    <option value="RTGS">RTGS</option>
                    <option value="UPI">UPI</option>
                </select>
            </div>
            <div class="form-group">
                <label>From Account (Bank/UPI ID)</label>
                <input type="text" id="f-from-account" placeholder="HDFC Bank OOO1 or user@upi" oninput="liveUpdate()"/>
            </div>
            <div class="form-group">
                <label>Comment / Note (Above Amount)</label>
                <textarea id="f-note" placeholder="Thank you for choosing TradeGuru Premium services!" oninput="liveUpdate()"></textarea>
            </div>
            
            <div class="form-section-title">Transaction Details</div>
            <div class="form-group">
                <label>Payment Status</label>
                <select id="f-status" onchange="liveUpdate()">
                    <option value="success" selected>Successful</option>
                    <option value="failed">Unsuccessful</option>
                </select>
            </div>
            <div class="form-group">
                <label> Payment ID <button class="auto-btn" onclick="autoPaymentId()">Auto Generate</button> </label>
                <input type="text" id="f-payid" placeholder="pay_XXXXXXXXXXXXXXXX" oninput="liveUpdate()"/>
            </div>
            <div class="form-group">
                <label> Transaction Reference No. <button class="auto-btn" onclick="autoRefNo()">Auto Generate</button> </label>
                <input type="text" id="f-refno" placeholder="TRX2025XXXXXXXXXX" oninput="liveUpdate()"/>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="f-date" oninput="liveUpdate()"/>
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="f-time" oninput="liveUpdate()"/>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn-download" onclick="downloadPDF()">⬇ Download PDF</button>
                <button class="btn-share" onclick="shareReceipt()">🔗 Share</button>
                <button class="btn-reset" onclick="resetForm()">↺</button>
            </div>
            <div id="status-msg" class="status-msg"></div>
        </div>
        
        <div class="preview-panel">
            <div class="preview-label">Live Receipt Preview</div>
            <div id="receipt">
                <div class="receipt-header">
                    <div class="receipt-tick">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="receipt-status">Payment Successful</div>
                </div>
                <div class="receipt-body">
                    <div style="text-align:center; margin-top: 10px; margin-bottom: 4px;">
                        <div class="receipt-note" id="r-note"></div>
                        <div class="receipt-amount-label" id="r-amount-label">Amount Paid</div>
                        <div class="receipt-amount" id="r-amount">₹0.00</div>
                        
                        <div id="r-status-badge" class="receipt-badge-container badge-success">Paid</div>
                    </div>
                    <div class="receipt-divider"></div>
                    <div class="receipt-row">
                        <div class="receipt-row-label">Customer Name</div>
                        <div class="receipt-row-value" id="r-name">—</div>
                    </div>
                    <div class="receipt-row">
                        <div class="receipt-row-label">Account</div>
                        <div class="receipt-row-value" id="r-account">********0000</div>
                    </div>
                    <div class="receipt-row">
                        <div class="receipt-row-label">IFSC</div>
                        <div class="receipt-row-value" id="r-ifsc">—</div>
                    </div>
                    <div class="receipt-divider"></div>
                    <div class="receipt-row">
                        <div class="receipt-row-label">Payment Method</div>
                        <div class="receipt-row-value" id="r-method">UPI</div>
                    </div>
                    <div class="receipt-row">
                        <div class="receipt-row-label">From Account</div>
                        <div class="receipt-row-value" id="r-from-account">—</div>
                    </div>
                    <div class="receipt-row">
                        <div class="receipt-row-label">Payment ID</div>
                        <div class="receipt-row-value" id="r-payid">—</div>
                    </div>
                    <div class="receipt-row">
                        <div class="receipt-row-label">Date & Time</div>
                        <div class="receipt-row-value" id="r-datetime">—</div>
                    </div>
                    <div class="receipt-ref">
                        <div class="receipt-ref-label">Transaction Reference Number</div>
                        <div class="receipt-ref-value" id="r-refno">—</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let fallbackRandomDigits = String(Math.floor(1000 + Math.random() * 9000));

        window.addEventListener('load', () => {
            const now = new Date();
            document.getElementById('f-date').value = now.toISOString().split('T')[0];
            document.getElementById('f-time').value = now.toTimeString().slice(0,5);
            autoPaymentId();
            autoRefNo();
            liveUpdate();
        });

        function autoPaymentId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let id = 'pay_';
            for (let i = 0; i < 16; i++) id += chars[Math.floor(Math.random() * chars.length)];
            document.getElementById('f-payid').value = id;
            liveUpdate();
        }

        function autoRefNo() {
            const now = new Date();
            const yr  = now.getFullYear();
            const mo  = String(now.getMonth() + 1).padStart(2, '0');
            const dy  = String(now.getDate()).padStart(2, '0');
            const rnd = Math.floor(Math.random() * 9000000000) + 1000000000;
            document.getElementById('f-refno').value = `TRX${yr}${mo}${dy}${rnd}`;
            liveUpdate();
        }

        function liveUpdate() {
            const name        = document.getElementById('f-name').value    || '—';
            const account     = document.getElementById('f-account').value;
            const ifsc        = document.getElementById('f-ifsc').value    || '—';
            const plan        = document.getElementById('f-plan').value;
            const billing     = document.getElementById('f-billing').value;
            const amount      = parseFloat(document.getElementById('f-amount').value);
            const method      = document.getElementById('f-method').value;
            const fromAccount = document.getElementById('f-from-account').value || '—';
            const noteText    = document.getElementById('f-note').value;
            const payid       = document.getElementById('f-payid').value   || '—';
            const refno       = document.getElementById('f-refno').value   || '—';
            const date        = document.getElementById('f-date').value;
            const time        = document.getElementById('f-time').value;
            const status      = document.getElementById('f-status').value;

            let maskedAccount = '********' + fallbackRandomDigits;
            if (account) {
                const cleanDigits = account.replace(/\D/g, ''); 
                if (cleanDigits.length > 0) {
                    maskedAccount = '********' + cleanDigits.slice(-4).padStart(4, '0');
                }
            }

            // Fixed amount parsing logic (Removed multiplication miscalculation)
            const baseValue = amount ? amount.toFixed(2) : '0.00';
            document.getElementById('r-amount').textContent = `₹${baseValue}`;

            document.getElementById('r-name').textContent    = name;
            document.getElementById('r-account').textContent = maskedAccount;
            document.getElementById('r-ifsc').textContent    = ifsc;

            document.getElementById('r-method').textContent       = method;
            document.getElementById('r-from-account').textContent  = fromAccount;
            document.getElementById('r-payid').textContent        = payid;
            document.getElementById('r-refno').textContent        = refno;

            const noteEl = document.getElementById('r-note');
            if (noteText.trim()) {
                noteEl.textContent = noteText;
                noteEl.style.display = 'block';
            } else {
                noteEl.style.display = 'none';
            }

            if (date && time) {
                const d = new Date(`${date}T${time}`);
                const opts = { day: '2-digit', month: 'short', year: 'numeric' };
                const dateStr = d.toLocaleDateString('en-IN', opts);
                const timeStr = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
                document.getElementById('r-datetime').textContent = `${dateStr}, ${timeStr}`;
            }

            const headerEl = document.querySelector('.receipt-header');
            const tickEl = document.querySelector('.receipt-tick');
            const statusTextEl = document.querySelector('.receipt-status');
            const amountLabelEl = document.getElementById('r-amount-label');
            const statusBadgeEl = document.getElementById('r-status-badge');

            if (status === 'failed') {
                headerEl.style.background = 'linear-gradient(135deg, #2c0b0e, #4a151b)';
                tickEl.style.background = 'linear-gradient(135deg, #ff5252, #c62828)';
                tickEl.style.boxShadow = '0 8px 24px rgba(255,82,82,0.4)';
                statusTextEl.textContent = 'Payment Unsuccessful';
                amountLabelEl.textContent = 'Amount Unpaid';
                
                // Swap badge theme to red Unpaid text
                statusBadgeEl.textContent = 'Unpaid';
                statusBadgeEl.className = 'receipt-badge-container badge-failed';

                tickEl.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                `;
            } else {
                headerEl.style.background = 'linear-gradient(135deg, #0a1628, #1a3a5c)';
                tickEl.style.background = 'linear-gradient(135deg, #00c896, #00a87a)';
                tickEl.style.boxShadow = '0 8px 24px rgba(0,200,150,0.4)';
                statusTextEl.textContent = 'Payment Successful';
                amountLabelEl.textContent = 'Amount Paid';
                
                // Swap badge theme to green Paid text
                statusBadgeEl.textContent = 'Paid';
                statusBadgeEl.className = 'receipt-badge-container badge-success';

                tickEl.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                `;
            }
        }

        async function captureReceiptBlob() {
            const receipt = document.getElementById('receipt');
            const canvas = await html2canvas(receipt, {scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false });
            return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        }

        async function downloadPDF() {
            const btn = document.querySelector('.btn-download');
            const statusEl = document.getElementById('status-msg');
            btn.textContent = 'Generating...';
            btn.disabled = true;
            statusEl.className = 'status-msg';
            try {
                const receipt = document.getElementById('receipt');
                const canvas = await html2canvas(receipt, {scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false });
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdfW = 105; 
                const pdfH = (canvas.height * pdfW) / canvas.width;
                const pdf = new jsPDF({orientation: pdfH > pdfW ? 'portrait' : 'landscape', unit: 'mm', format: [pdfW, pdfH] });
                pdf.addImage(imgData, 'PNG', 0, 0, pdfW, pdfH);
                const name = document.getElementById('f-name').value.replace(/\s+/g, '_') || 'customer';
                const date = document.getElementById('f-date').value || 'receipt';
                pdf.save(`TradeGuru_Receipt_${name}_${date}.pdf`);
                statusEl.textContent = '✓ Receipt downloaded successfully!';
                statusEl.className = 'status-msg success';
            } catch (err) {
                statusEl.textContent = '✕ Download failed. Please try again.';
                statusEl.className = 'status-msg error';
                console.error(err);
            }
            btn.textContent = '⬇ Download PDF';
            btn.disabled = false;
            setTimeout(() => { statusEl.className = 'status-msg'; }, 4000);
        }

        async function shareReceipt() {
            const btn = document.querySelector('.btn-share');
            const statusEl = document.getElementById('status-msg');
            btn.textContent = 'Processing...';
            btn.disabled = true;
            try {
                const blob = await captureReceiptBlob();
                const name = document.getElementById('f-name').value.replace(/\s+/g, '_') || 'customer';
                const file = new File([blob], `Receipt_${name}.png`, { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({files: [file], title: 'TradeGuru Payment Receipt', text: `Payment Receipt for ${name.replace(/_/g, ' ')}` });
                    statusEl.textContent = '✓ Shared successfully!';
                    statusEl.className = 'status-msg success';
                } else {
                    const imgUrl = URL.createObjectURL(blob);
                    const altWin = window.open(imgUrl, '_blank');
                    if(altWin) {
                        statusEl.textContent = '✓ Opened image in a new tab to share/save manually.';
                        statusEl.className = 'status-msg success';
                    } else {
                        throw new Error('Popup blocked');
                    }
                }
            } catch (err) {
                statusEl.textContent = '✕ Sharing failed or cancelled.';
                statusEl.className = 'status-msg error';
                console.error(err);
            }
            btn.textContent = '🔗 Share';
            btn.disabled = false;
            setTimeout(() => { statusEl.className = 'status-msg'; }, 4000);
        }

        function resetForm() {
            ['f-name','f-account','f-ifsc','f-amount','f-from-account','f-note'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('f-plan').value    = 'Pro Plan';
            document.getElementById('f-billing').value = 'Monthly';
            document.getElementById('f-method').value  = 'UPI';
            document.getElementById('f-status').value  = 'success'; 

            fallbackRandomDigits = String(Math.floor(1000 + Math.random() * 9000));
            const now = new Date();
            document.getElementById('f-date').value = now.toISOString().split('T')[0];
            document.getElementById('f-time').value = now.toTimeString().slice(0,5);
            autoPaymentId();
            autoRefNo();
            liveUpdate();
        }
    </script>
</body>
</html>
